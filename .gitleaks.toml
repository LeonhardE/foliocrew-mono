title = "Foliocrew secret scanning policy"

[extend]
useDefault = true

# Firebase Web config is public browser configuration, not GCP IAM authority.
# Only the audited immutable history below is exempt at this path/assignment.
# New history, index and current source must not reintroduce inline key values.
# Historical scan exceptions do not establish provider-side key revocation.
[[rules]]
id = "gcp-api-key"
[[rules.allowlists]]
description = "Public Firebase Web configuration assignment"
condition = "AND"
commits = [
  "808cbc5ff81bdb045e71956ee16582b24ccc8ab6",
  "d11265d92c7b938b387f73423872b985ba484656",
]
paths = ['''^infra/gcp/terraform/bootstrap/web\.tf$''']
regexTarget = "line"
regexes = ['''^\r?\n?[ \t]*_FIREBASE_API_KEY[ \t]*=[ \t]*"AIza[A-Za-z0-9_-]{35}"[ \t]*\r?\n?$''']

# The two exact fragments below occur in the audited public JWS payload vectors.
# They are public ciphertext/context bytes, not API credentials. Every other
# value and all other rules remain active in this same fixture file.
[[rules]]
id = "generic-api-key"
[[rules.allowlists]]
description = "Public Firebase Web configuration assignment (generic detector)"
condition = "AND"
commits = [
  "808cbc5ff81bdb045e71956ee16582b24ccc8ab6",
  "d11265d92c7b938b387f73423872b985ba484656",
]
paths = ['''^infra/gcp/terraform/bootstrap/web\.tf$''']
regexTarget = "line"
regexes = ['''^\r?\n?[ \t]*_FIREBASE_API_KEY[ \t]*=[ \t]*"AIza[A-Za-z0-9_-]{35}"[ \t]*\r?\n?$''']
[[rules.allowlists]]
description = "Exact public JWS payload fragments in the audited interoperability fixture"
condition = "AND"
paths = ['''^services/common/tests/fixtures/encrypted_v2_node\.json$''']
regexTarget = "secret"
regexes = [
  '''^223\-hgbJIY8mvEpZnU6wQu\-5WfWetHvsc7NTV85o4sbvGqHPIrSw5A$''',
  '''^LyXMNgX2i0j4Q_T2y1RknvBEsxw6mCusighVkxONOao29xKwuMad4A$''',
]

# These exact values are public AES-wrapped CEK ciphertext in the independently
# generated persistent-content fixture. They are not plaintext keys/credentials.
[[rules.allowlists]]
description = "Exact public wrapped-key lines in the persistent content interoperability fixture"
condition = "AND"
paths = ['''^services/common/tests/fixtures/persistent_content_node\.json$''']
regexTarget = "line"
regexes = [
  '''^\r?\n?[ \t]*"encrypted_key":[ \t]*"D5GfmqEVj8riDTQajlMHMxeydaM7jgy0M3F6U2szh\-DFpOqdi4wCEg",?[ \t]*\r?\n?$''',
  '''^\r?\n?[ \t]*"encrypted_key":[ \t]*"3DzYqCqZwYZbjI1489L1Z5OyoPJQWqO\-YyPkI7G5k7ttMyChp5\-93g",?[ \t]*\r?\n?$''',
]
